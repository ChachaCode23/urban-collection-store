<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Urban Collection Store - Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; }
    .header { background: #333; color: white; padding: 15px 20px; }
    .container { padding: 20px; }
    .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { margin-bottom: 10px; color: #333; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #333; color: white; }
    button { padding: 8px 15px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Urban Collection Store - Panel de Usuario</h1>
  </div>
  <div class="container">
    <div class="card">
      <h2>Mis Pedidos</h2>
      <table>
        <thead>
          <tr>
            <th>Pedido</th>
            <th>Producto</th>
            <th>Total</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="pedidos-lista">
        </tbody>
      </table>
    </div>
  </div>
  <script>
    // datos de ejemplo
    const pedidos = [
      { id: "#001", producto: "T-shirt City Lab", total: "$800.00", estado: "Entregado" },
      { id: "#002", producto: "Reloj Invicta", total: "$4500.00", estado: "En camino" },
      { id: "#003", producto: "Perfume Game of Spade Rouge", total: "$3800.00", estado: "Pendiente" }
    ];

    function cargarPedidos() {
      const lista = document.getElementById("pedidos-lista");
      pedidos.forEach(function(pedido) {
        lista.innerHTML += "<tr><td>" + pedido.id + "</td><td>" + pedido.producto + "</td><td>" + pedido.total + "</td><td>" + pedido.estado + "</td></tr>";
      });
    }

    cargarPedidos();
  </script>
</body>
</html>
