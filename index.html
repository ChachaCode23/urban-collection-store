<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Urban Collection Store</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; }
    .header { background: #111; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #FF6347; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: #00b4d8; }
    .header span { color: #FF6347; font-weight: bold; }
    .container { padding: 20px; max-width: 900px; margin: auto; }
    .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); border-top: 4px solid #FF6347; }
    h2 { margin-bottom: 15px; color: #111; border-bottom: 2px solid #00b4d8; padding-bottom: 5px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
    button { padding: 10px 20px; background: #FF6347; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px 5px 5px 0; }
    button:hover { background: #e5533d; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #111; color: white; }
    .btn-edit { background: #00b4d8; }
    .btn-edit:hover { background: #0096c7; }
    .btn-delete { background: #c0392b; }
    .btn-delete:hover { background: #a93226; }
    .mensaje { color: #FF6347; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>

<div class="header">
  <h1>URBAN COLLECTION STORE</h1>
  <span>Panel de Administración</span>
</div>

<div class="container">

  <div class="card">
    <h2>Agregar Productos</h2>
    <p id="mensaje" class="mensaje"></p>
    <input type="text" id="nombre" placeholder="Nombre del producto" />
    <input type="text" id="categoria" placeholder="Categoría (Ropa, Accesorios, etc)" />
    <input type="number" id="precio" placeholder="Precio en RD$" />
    <input type="number" id="stock" placeholder="Stock disponible" />
    <button onclick="agregarProducto()">Agregar Producto</button>
  </div>

  <div class="card">
    <h2>Listado de Productos</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Producto</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-productos"></tbody>
    </table>
  </div>

</div>

<script>
  let productos = [
    { id: 1, nombre: "T-shirt City Lab", categoria: "Ropa", precio: 800, stock: 10 },
    { id: 2, nombre: "Reloj Invicta", categoria: "Accesorios", precio: 4500, stock: 5 },
    { id: 3, nombre: "Perfume Game of Spade Rouge", categoria: "Perfumes", precio: 3800, stock: 8 }
  ];
  let nextId = 4;

  function mostrarProductos() {
    const tabla = document.getElementById("tabla-productos");
    tabla.innerHTML = "";
    productos.forEach(function(p) {
      tabla.innerHTML += "<tr>" +
        "<td>" + p.id + "</td>" +
        "<td>" + p.nombre + "</td>" +
        "<td>" + p.categoria + "</td>" +
        "<td>RD$ " + p.precio + "</td>" +
        "<td>" + p.stock + "</td>" +
        "<td>" +
          "<button class='btn-edit' onclick='editarProducto(" + p.id + ")'>Editar</button>" +
          "<button class='btn-delete' onclick='eliminarProducto(" + p.id + ")'>Eliminar</button>" +
        "</td>" +
      "</tr>";
    });
  }

  function agregarProducto() {
    const nombre = document.getElementById("nombre").value;
    const categoria = document.getElementById("categoria").value;
    const precio = document.getElementById("precio").value;
    const stock = document.getElementById("stock").value;

    if (nombre == "" || categoria == "" || precio == "" || stock == "") {
      alert("Por favor completa todos los campos");
      return;
    }

    productos.push({ id: nextId++, nombre: nombre, categoria: categoria, precio: parseInt(precio), stock: parseInt(stock) });
    document.getElementById("nombre").value = "";
    document.getElementById("categoria").value = "";
    document.getElementById("precio").value = "";
    document.getElementById("stock").value = "";
    document.getElementById("mensaje").innerText = "Producto agregado correctamente!";
    setTimeout(function() { document.getElementById("mensaje").innerText = ""; }, 2000);
    mostrarProductos();
  }

  function eliminarProducto(id) {
    if (confirm("¿Seguro que deseas eliminar este producto?")) {
      productos = productos.filter(function(p) { return p.id !== id; });
      mostrarProductos();
    }
  }

  function editarProducto(id) {
    const producto = productos.find(function(p) { return p.id === id; });
    const nuevoNombre = prompt("Nuevo nombre:", producto.nombre);
    const nuevoPrecio = prompt("Nuevo precio en RD$:", producto.precio);
    const nuevoStock = prompt("Nuevo stock:", producto.stock);

    if (nuevoNombre && nuevoPrecio && nuevoStock) {
      producto.nombre = nuevoNombre;
      producto.precio = parseInt(nuevoPrecio);
      producto.stock = parseInt(nuevoStock);
      mostrarProductos();
    }
  }

  mostrarProductos();
</script>

</body>
</html>
